<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%2322d3ee'/%3E%3Ctext x='24' y='31' font-family='Arial' font-weight='700' font-size='17' text-anchor='middle' fill='%23021018'%3EEM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="login.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
<title>POC Operations Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Expert Mobile POC Operations Center — HUD layout: icon rail + top bar + views; light = violet/orange, dark = Jarvis cyan */
:root{
  --bg:#f4f3fb; --bg2:#ebe8f8; --panel:#ffffff; --panel2:#f5f3fd; --line:#e3dff3; --fg:#1d1838; --muted:#6c6890;
  --acc:#4f46e5; --acc-rgb:79,70,229; --acc2:#f97316; --acc2-rgb:249,115,22; --acc-soft:#ece9fe; --acc2-soft:#ffedd5;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2; --idle:#a5a2c2;
  --s1:#4f46e5; --s2:#f97316; --s3:#14b8a6; --s4:#ec4899; --s5:#8b5cf6; --s6:#eab308;
  --grid:rgba(79,70,229,.06); --glow:0 10px 30px -12px rgba(79,70,229,.25); --shadow:0 1px 2px rgba(29,24,56,.06),0 8px 24px -14px rgba(29,24,56,.18);
  --r:16px; --f-hud:"Orbitron","Rajdhani",system-ui,sans-serif; --f-lab:"Rajdhani","Exo 2",system-ui,sans-serif; --f-body:"Exo 2",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#03080f; --bg2:#06121d; --panel:rgba(7,22,35,.82); --panel2:rgba(10,32,48,.75); --line:rgba(34,211,238,.20); --fg:#d6f5ff; --muted:#79a9bd;
  --acc:#22d3ee; --acc-rgb:34,211,238; --acc2:#fbbf24; --acc2-rgb:251,191,36; --acc-soft:rgba(34,211,238,.12); --acc2-soft:rgba(251,191,36,.12);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.13); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.13); --bad:#fb7185; --bad-soft:rgba(251,113,133,.14); --idle:#41606f;
  --s1:#22d3ee; --s2:#fbbf24; --s3:#34d399; --s4:#fb7185; --s5:#a78bfa; --s6:#60a5fa;
  --grid:rgba(34,211,238,.07); --glow:0 0 0 1px rgba(34,211,238,.10),0 0 28px -8px rgba(34,211,238,.35); --shadow:0 0 0 1px rgba(34,211,238,.06);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#03080f; --bg2:#06121d; --panel:rgba(7,22,35,.82); --panel2:rgba(10,32,48,.75); --line:rgba(34,211,238,.20); --fg:#d6f5ff; --muted:#79a9bd;
  --acc:#22d3ee; --acc-rgb:34,211,238; --acc2:#fbbf24; --acc2-rgb:251,191,36; --acc-soft:rgba(34,211,238,.12); --acc2-soft:rgba(251,191,36,.12);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.13); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.13); --bad:#fb7185; --bad-soft:rgba(251,113,133,.14); --idle:#41606f;
  --s1:#22d3ee; --s2:#fbbf24; --s3:#34d399; --s4:#fb7185; --s5:#a78bfa; --s6:#60a5fa;
  --grid:rgba(34,211,238,.07); --glow:0 0 0 1px rgba(34,211,238,.10),0 0 28px -8px rgba(34,211,238,.35); --shadow:0 0 0 1px rgba(34,211,238,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;transition:background .5s,color .5s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;animation:gridmove 40s linear infinite}
body::after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 85% 0%,rgba(var(--acc-rgb),.16),transparent 70%),radial-gradient(35% 30% at 0% 100%,rgba(var(--acc2-rgb),.12),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
@keyframes gridmove{to{background-position:44px 44px}}
@keyframes drift{to{transform:translate3d(-4%,3%,0)}}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.mono,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:88px 1fr;min-height:100vh}
/* rail */
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(10px);overflow-y:auto}
.rail .brand{width:56px;height:56px;margin-bottom:10px;display:grid;place-items:center;border-radius:14px;background:var(--acc-soft);overflow:hidden;flex:none}
.rail .brand img{max-width:100%;max-height:100%;object-fit:contain}
.rail .brand.has{background:#fff;padding:4px}
.rail .brand.round{border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 2px var(--acc),0 0 18px rgba(var(--acc-rgb),.55);animation:halo 4s ease-in-out infinite}
.rail .brand.round img{border-radius:50%}
@keyframes halo{50%{box-shadow:0 0 0 2px var(--acc2),0 0 26px rgba(var(--acc2-rgb),.55)}}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}
.clogo{border-radius:50%;object-fit:cover;background:#fff}
.loader{display:grid;place-items:center;gap:16px;padding:50px 0;text-align:center}
.lring{position:relative;width:128px;height:128px;display:grid;place-items:center}
.lring i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--acc);border-right-color:var(--acc);animation:spin 1.1s linear infinite;box-shadow:0 0 18px rgba(var(--acc-rgb),.35)}
.lring i+i{inset:12px;border-top-color:var(--acc2);border-right-color:transparent;border-left-color:var(--acc2);animation-duration:1.7s;animation-direction:reverse}
.lring .clogo,.lring svg{position:relative;z-index:1;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.radar-wrap{display:grid;place-items:center}
.radar .sweep{transform-origin:50% 50%;transform-box:view-box;animation:spin 6s linear infinite}
.flowlink{transition:stroke-opacity .2s}.flowlink:hover{stroke-opacity:.7!important}
.tm{position:relative;width:100%;border-radius:12px;overflow:hidden}
.tmc{position:absolute;border:2px solid var(--panel);border-radius:8px;padding:6px 8px;text-align:left;color:#fff;cursor:pointer;overflow:hidden;animation:pop .6s both cubic-bezier(.2,.7,.2,1);transition:filter .2s,transform .2s}
.tmc:hover{filter:brightness(1.15);transform:scale(1.02);z-index:2}
.tmc span{display:flex;flex-direction:column;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tmc b{font:700 12.5px var(--f-lab);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tmc small{font:600 11px var(--f-num);opacity:.9}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.heat td{padding:4px 6px}.heat td:first-child{white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.hc{width:100%;min-width:44px;border:0;border-radius:6px;padding:6px 4px;font:700 12px var(--f-num);cursor:pointer;color:var(--fg);background:rgba(var(--acc2-rgb),var(--a));animation:pop .5s both}
.hc:disabled{background:transparent;color:var(--muted);cursor:default}
.hc:not(:disabled):hover{outline:2px solid var(--acc)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px;border:2px dashed var(--acc);border-radius:var(--r);background:var(--acc-soft);cursor:pointer;text-align:center;transition:transform .2s,background .2s}
.drop.over,.drop:hover{transform:scale(1.01);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.drop-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;transform:rotate(180deg);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(180deg) translateY(6px)}}
.drop-ic svg{width:24px;height:24px}
.mapbox{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.src .src-h{display:flex;align-items:center;gap:8px}.src .big{font:700 30px var(--f-num);margin:8px 0 2px}
.xbtn{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit}
.xbtn i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}.xbtn i svg{width:20px;height:20px}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.tg{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px;background:var(--panel2)}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg .knob{flex:none;width:36px;height:20px;border-radius:10px;background:var(--idle);position:relative;transition:background .2s}
.tg .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.tg input:checked+.knob{background:var(--acc);box-shadow:0 0 10px rgba(var(--acc-rgb),.5)}.tg input:checked+.knob::after{left:18px}
.tg input:focus-visible+.knob{outline:2px solid var(--acc2)}
.exlist{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;margin-top:8px}
.logo-slot{display:flex;gap:14px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:12px;margin-bottom:10px;outline:none}
.logo-slot:focus{border-color:var(--acc);box-shadow:var(--glow)}
.logo-prev{flex:none;min-width:84px;height:72px;padding:6px 10px;border-radius:12px;background:#fff;display:grid;place-items:center}
.logo-prev.round{min-width:72px;width:72px;border-radius:50%;padding:4px}
.banner{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;margin-bottom:14px;font-weight:600;border:1px solid;animation:viewin .5s}
.banner.info{background:var(--acc-soft);border-color:var(--acc)}.banner.warn{background:var(--warn-soft);border-color:var(--warn)}.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner svg{width:20px;height:20px;flex:none}
.danger{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.bulk{background:var(--acc-soft)}
.kpi.live .lab i{position:relative}.kpi.live .lab i::after{content:"";position:absolute;inset:-4px;border-radius:12px;border:2px solid var(--ok);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{opacity:.8;transform:scale(.8)}to{opacity:0;transform:scale(1.5)}}
.kpi{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .2s,border-color .2s;transform-style:preserve-3d}
.kpi::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s;pointer-events:none}
.kpi:hover::before{transform:translateX(120%)}
.toplogo{flex:none;height:44px;padding:6px 12px;border-radius:12px;background:#fff;display:flex;align-items:center;box-shadow:var(--shadow),var(--glow)}
.toplogo img{height:30px;width:auto;display:block}
.toplogo[hidden]{display:none}
@media (max-width:820px){.toplogo{height:36px;padding:4px 8px}.toplogo img{height:24px}}
.rail a{width:72px;padding:9px 4px 7px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);text-decoration:none;font:600 11px/1.1 var(--f-lab);letter-spacing:.04em;text-transform:uppercase;text-align:center;position:relative;transition:background .2s,color .2s}
.rail a svg{width:22px;height:22px}
.rail a:hover{color:var(--fg);background:var(--panel2)}
.rail a.on{color:var(--acc);background:var(--acc-soft)}
.rail a.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.rail a .badge{position:absolute;top:4px;right:8px;min-width:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:700 10px/18px var(--f-num)}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);overflow-x:clip;overflow-y:visible}
.top::after{content:"";position:absolute;left:-30%;bottom:0;height:2px;width:30%;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:scan 5s linear infinite}
@keyframes scan{to{left:100%}}
.ttl{min-width:0}
.ttl h1{margin:0;font:800 17px/1.1 var(--f-hud);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.ttl h1 b{color:var(--acc2)}
.ttl .sub{font:600 12px var(--f-lab);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow),var(--glow);padding:6px;backdrop-filter:blur(14px)}
.sres button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer}
.sres button:hover,.sres button:focus{background:var(--acc-soft);outline:none}
.sres .k{font:700 10px var(--f-lab);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);min-width:58px}
.sres small{color:var(--muted);margin-left:auto;font-size:12px}
.tb-actions{display:flex;align-items:center;gap:8px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--fg);transition:transform .25s,border-color .2s}
.ibtn:hover{border-color:var(--acc);transform:rotate(-12deg)}
.ibtn svg{width:19px;height:19px}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--panel);max-width:220px}
.me img{width:30px;height:30px;border-radius:50%}
.me div{min-width:0;line-height:1.1}
.me b{display:block;font:600 13px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{font:700 10px var(--f-lab);letter-spacing:.08em;text-transform:uppercase;color:var(--acc2)}
.fresh{display:flex;gap:6px;flex-wrap:wrap;padding:8px 24px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:600 12px var(--f-lab);letter-spacing:.04em;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
main{padding:18px 24px 60px;min-width:0}
.view{animation:viewin .45s cubic-bezier(.2,.7,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sec-h h2{margin:0;font:700 20px/1.15 var(--f-hud);letter-spacing:.08em;text-transform:uppercase}
.sec-h p{margin:4px 0 0;color:var(--muted)}
h3{margin:0 0 10px;font:700 13px/1.2 var(--f-lab);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* cards */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);min-width:0;animation:cardin .5s both cubic-bezier(.2,.7,.2,1)}
.card.click{cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.card.click:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:var(--glow)}
@keyframes cardin{from{opacity:0;transform:translateY(10px) scale(.99)}}
:root[data-theme="dark"] .card::before,:root[data-theme="dark"] .card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--acc);pointer-events:none;opacity:.7}
:root[data-theme="dark"] .card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
:root[data-theme="dark"] .card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card::before,:root:not([data-theme="light"]) .card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--acc);pointer-events:none;opacity:.7}
:root:not([data-theme="light"]) .card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
:root:not([data-theme="light"]) .card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1.9fr)}
.span2{grid-column:span 2}
.mt{margin-top:14px}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{position:relative;overflow:hidden;border-radius:var(--r);padding:16px 18px 14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;animation:cardin .5s both;min-width:0}
.kpi:hover,.kpi:focus-visible{transform:translateY(-3px);border-color:var(--acc);box-shadow:var(--glow);outline:none}
.kpi .lab{font:700 12px var(--f-lab);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .lab i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:none}
.kpi .lab i svg{width:16px;height:16px}
.kpi .val{font:700 30px/1.15 var(--f-num);margin-top:10px;letter-spacing:-.02em}
.kpi .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .spark{position:absolute;right:-6px;bottom:-6px;width:110px;height:46px;opacity:.6;color:var(--acc)}
.kpi.solid .spark,.kpi.orange .spark{color:#fff}
.kpi.solid{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--s5)));color:#fff;border-color:transparent}
.kpi.solid .lab,.kpi.solid .note{color:rgba(255,255,255,.85)}.kpi.solid .lab i{background:rgba(255,255,255,.2);color:#fff}
:root[data-theme="dark"] .kpi.solid{background:linear-gradient(135deg,rgba(34,211,238,.28),rgba(34,211,238,.06));color:var(--fg);border-color:var(--acc)}
.kpi.orange{background:linear-gradient(135deg,var(--acc2),#fb923c);color:#fff;border-color:transparent}
.kpi.orange .lab,.kpi.orange .note{color:rgba(255,255,255,.9)}.kpi.orange .lab i{background:rgba(255,255,255,.22);color:#fff}
:root[data-theme="dark"] .kpi.orange{background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(251,191,36,.05));color:var(--fg);border-color:var(--acc2)}
.kpi.alarm{border-color:var(--bad)}
.kpi.alarm::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--bad);animation:pulse 2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{opacity:.15}}
.kpi.alarm .val{color:var(--bad)}
/* reactor gauge */
.reactor{display:grid;place-items:center;position:relative;cursor:pointer}
.reactor svg{width:min(240px,100%);height:auto;overflow:hidden}
.reactor{overflow:hidden;contain:paint}
.reactor .spin{transform-origin:120px 120px;animation:spin 14s linear infinite}
.reactor .spin2{transform-origin:120px 120px;animation:spin 22s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.reactor .big{font:800 34px var(--f-hud);fill:var(--fg)}
.reactor .cap{font:700 11px var(--f-lab);letter-spacing:.14em;fill:var(--muted);text-transform:uppercase}
/* charts */
svg text{fill:var(--muted);font:600 11px var(--f-lab)}
.hit{cursor:pointer;transition:opacity .2s,filter .2s}
.hit:hover{filter:brightness(1.12) drop-shadow(0 0 6px rgba(var(--acc-rgb),.5))}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend.col{flex-direction:column;gap:6px}
.legend button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 4px;border-radius:6px;cursor:pointer;text-align:left}
.legend button:hover{background:var(--acc-soft)}
.legend .n{margin-left:auto;font:600 13px var(--f-num);padding-left:10px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.donut-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-row .legend{flex:1;min-width:170px}
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 64px;gap:10px;align-items:center;font-size:13.5px;cursor:pointer;border-radius:8px;padding:2px 4px}
.brow:hover{background:var(--acc-soft)}
.brow .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .t{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;display:flex}
.brow .t i{display:block;height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.brow .v{text-align:right;font:600 13px var(--f-num)}
/* quadrant */
.quad{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:8px}
.quad .ax{font:700 11px var(--f-lab);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:grid;place-items:center;text-align:center}
.quad .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.qc{border-radius:12px;padding:12px;border:1px solid var(--line);cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:96px}
.qc:hover{transform:scale(1.02);box-shadow:var(--glow)}
.qc b{display:block;font:700 26px var(--f-num)}
.qc span{font-size:12.5px;color:var(--muted)}
.qc.ok{background:var(--ok-soft)}.qc.bad{background:var(--bad-soft);border-color:var(--bad)}.qc.warn{background:var(--warn-soft)}.qc.idle{background:var(--panel2)}
.qc.bad b{color:var(--bad)}.qc.warn b{color:var(--warn)}.qc.ok b{color:var(--ok)}
/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font:700 15px var(--f-hud);letter-spacing:.06em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font:700 10px var(--f-lab);color:var(--muted);letter-spacing:.08em}
.cal button{aspect-ratio:1;border:1px solid transparent;border-radius:9px;background:var(--panel2);font:600 12px var(--f-num);cursor:pointer;position:relative;padding:0;min-width:0}
.cal button.today{border-color:var(--acc)}
.cal button.h1{background:color-mix(in srgb,var(--acc2) 25%,var(--panel2))}.cal button.h2{background:color-mix(in srgb,var(--acc2) 55%,var(--panel2));color:#fff}.cal button.h3{background:var(--acc2);color:#fff;box-shadow:0 0 10px rgba(var(--acc2-rgb),.6)}
.cal button.past.h1,.cal button.past.h2,.cal button.past.h3{background:color-mix(in srgb,var(--bad) 40%,var(--panel2))}
.cal button:disabled{visibility:hidden}
.cal button small{position:absolute;right:3px;top:1px;font-size:9px}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;background:var(--panel2);backdrop-filter:blur(10px);text-align:left;font:700 11.5px var(--f-lab);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.rowc{cursor:pointer}
tr.rowc:hover td{background:var(--acc-soft)}
td.num,th.num{text-align:right}
td .cellbtn{border:0;background:none;padding:2px 6px;border-radius:6px;cursor:pointer;font:600 13px var(--f-num);color:inherit}
td .cellbtn:hover{background:var(--acc-soft);color:var(--acc)}
td .cellbtn.hot{color:var(--bad)}
.diff{color:var(--bad);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font:700 11px var(--f-lab);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-idle{background:var(--panel2);color:var(--muted)}.p-acc{background:var(--acc-soft);color:var(--acc)}
.health{display:flex;align-items:center;gap:8px;min-width:110px}
.health .track{flex:1;height:7px;border-radius:4px;background:var(--panel2);overflow:hidden}
.health .fill{height:100%;border-radius:4px}
/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:600 13.5px var(--f-body);transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#021018}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters select,.filters input,.inp{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-width:0}
.filters input{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font:600 13px var(--f-lab);letter-spacing:.04em}
.seg button.on{background:var(--acc);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#021018}
/* alerts feed */
.feed{display:flex;flex-direction:column;gap:6px}
.al{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:9px 12px 9px 0;border-radius:10px;background:var(--panel2);cursor:pointer;transition:transform .15s}
.al:hover{transform:translateX(3px)}
.al .bar{align-self:stretch;border-radius:4px}
.al.high .bar{background:var(--bad);box-shadow:0 0 8px var(--bad)}.al.med .bar{background:var(--warn)}.al.low .bar{background:var(--idle)}
.al .t{font-weight:600;font-size:14px}
.al .d{font-size:12.5px;color:var(--muted)}
.al .c{font-size:12.5px;color:var(--acc);text-align:right;max-width:180px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.45);backdrop-filter:blur(3px);z-index:50;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);z-index:51;background:var(--bg);border-left:1px solid var(--acc);box-shadow:-20px 0 60px -20px rgba(var(--acc-rgb),.45);display:flex;flex-direction:column;animation:slide .35s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dr-h{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-h h2{margin:0;font:700 17px/1.2 var(--f-hud);letter-spacing:.06em;text-transform:uppercase}
.dr-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
.dr-tabs{display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap}
.dr-ctl{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);align-items:center}
.dr-ctl input{flex:1;min-width:160px}
.dr-sum{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 0}
.dr-sum button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font:600 12px var(--f-lab);cursor:pointer}
.dr-sum button b{font-family:var(--f-num);margin-left:5px;color:var(--acc)}
.dr-body{flex:1;overflow:auto;padding:12px 20px 40px}
.dr-prog{padding:10px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.dp-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dp-txt{font:600 13.5px var(--f-body)}.dp-txt b{color:var(--acc);font-size:15px}
.dp-bar{height:8px;margin:0}.dp-bar i{background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .6s ease}
.dp-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dr-prog .seg button b{margin-left:4px}
.item.leaving{animation:leave .45s ease forwards;pointer-events:none}
@keyframes leave{0%{opacity:1;transform:none}60%{opacity:.4;transform:translateX(30px);background:var(--ok-soft)}100%{opacity:0;transform:translateX(60px);max-height:0;margin:0;padding:0}}
.item.flash{animation:flash 1.2s ease}@keyframes flash{0%{box-shadow:0 0 0 2px var(--ok)}100%{box-shadow:none}}
.actwrap{display:grid;gap:6px;margin-top:10px}.actwrap .act{margin-top:0}
.act.quick{flex-wrap:wrap}.qbtn.ok{border-color:var(--ok);color:var(--ok)}
.wnote{font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}.wnote.waiting,.wnote.confirmed{color:var(--ok);background:var(--ok-soft)}.wnote.recheck{color:var(--warn);background:var(--warn-soft)}
.grp{margin-bottom:14px}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);font:700 13px var(--f-lab);letter-spacing:.06em;text-transform:uppercase}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";transition:transform .2s;color:var(--acc)}
.grp[open]>summary::before{transform:rotate(90deg)}
.grp>summary b{margin-left:auto;font-family:var(--f-num);color:var(--acc)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--panel)}
.item .ih{display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer}
.item .ih b{font-size:14px}
.item .ih .mono{font-size:12px;color:var(--muted)}
.item .ih .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;margin:10px 0 2px;font-size:13px}
.kv div{min-width:0}
.kv span{display:block;font:700 10.5px var(--f-lab);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv em{font-style:normal;word-break:break-word}
.issues{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.issues li::before{content:"● ";color:var(--warn)}
.issues li.high::before{color:var(--bad)}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px}
.act select,.act input{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.act input{flex:1;min-width:140px}
/* misc */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
.prog{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.hint{font-size:13px;color:var(--muted)}
.task{display:flex;flex-direction:column;gap:6px}
.task .big{font:700 34px var(--f-num)}
.task.bad .big{color:var(--bad)}.task.warn .big{color:var(--warn)}
.gate{max-width:520px;margin:12vh auto;text-align:center}
.gate .logo{width:96px;height:96px;margin:0 auto 18px;display:grid;place-items:center;border-radius:24px;background:var(--acc-soft)}
.gate code{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--panel2);word-break:break-all;font-size:12px}
.ulist{display:flex;flex-direction:column;gap:8px}
.urow{display:grid;grid-template-columns:36px minmax(0,1fr) 130px 150px auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.urow img{width:36px;height:36px;border-radius:50%}
.urow select,.urow input{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);min-width:0;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font:700 11px var(--f-lab);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.form input,.form select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font:500 14px var(--f-body);color:var(--fg);text-transform:none;letter-spacing:0}
.paste{border:2px dashed var(--acc);border-radius:var(--r);padding:22px;text-align:center;background:var(--acc-soft);outline:none}
.paste:focus{box-shadow:var(--glow)}
.cmp-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cmp-pick select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);max-width:240px}

.wgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;grid-auto-flow:dense}
.card[data-key]{padding-right:18px}
.card[style*="height"]{overflow-y:auto;overflow-x:hidden}
.ctl{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:.35;transition:opacity .2s;z-index:3}
.card:hover>.ctl,.card:focus-within>.ctl{opacity:1}
.cb{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;display:grid;place-items:center;font:700 13px/1 var(--f-body);padding:0}
.cb:hover{border-color:var(--acc);color:var(--acc)}
.cb.grip{cursor:grab;letter-spacing:-2px}
.rz{position:absolute;right:2px;bottom:2px;width:18px;height:18px;cursor:nwse-resize;z-index:3;opacity:.45;background:linear-gradient(135deg,transparent 50%,var(--acc) 50%,var(--acc) 58%,transparent 58%,transparent 70%,var(--acc) 70%,var(--acc) 78%,transparent 78%);border-bottom-right-radius:var(--r);touch-action:none}
.card:hover>.rz{opacity:1}
.card.resizing{outline:2px dashed var(--acc);transition:none!important;user-select:none}
.rztip{position:absolute;right:24px;bottom:6px;padding:3px 8px;border-radius:6px;background:var(--acc);color:#fff;font:700 11px var(--f-num);z-index:4}
.card.collapsed{height:auto!important;overflow:hidden}
.card.collapsed>*:not(h3):not(.ctl):not(.rz){display:none!important}
.card.collapsed>h3{margin:0}
.card.maxed{position:fixed!important;inset:24px;z-index:70;height:auto!important;overflow:auto;grid-column:auto!important;box-shadow:0 0 0 100vmax rgba(3,8,15,.72),var(--glow);animation:viewin .3s}
.card.maxed .radar,.card.maxed .radar-wrap svg{max-width:none!important}
.card.dragging{opacity:.4}
.card.dropto{outline:2px dashed var(--acc2)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;color:inherit;font:inherit}
.mrow:disabled{cursor:default;opacity:1}
.mrow:not(:disabled):hover{border-color:var(--acc)}
.mrow span{font-size:13px}.mrow b{font-size:15px}.mrow small{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.mrow.bad b{color:var(--bad)}.mrow.warn b{color:var(--warn)}.mrow.ok b{color:var(--ok)}
.ratio{display:flex;flex-direction:column;gap:4px;text-align:left;padding:6px 8px;border:0;background:none;border-radius:8px;cursor:pointer;color:inherit;font:inherit}
.ratio:hover{background:var(--acc-soft)}
.ratio .rl{display:flex;justify-content:space-between;font-size:13px}
.ratio .track{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}.ratio .track i{display:block;height:100%;border-radius:4px;animation:grow 1s both}
.ratio small{color:var(--muted);font-size:11px}
.whatif{display:flex;flex-direction:column;gap:10px}
.sl{display:flex;flex-direction:column;gap:4px;font-size:13px}
.sl>span{display:flex;justify-content:space-between}
.sl input[type=range]{width:100%;accent-color:var(--acc)}
.dl{display:block;margin-top:4px;font:700 11px var(--f-num)}
.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}.dl.flat{color:var(--muted)}
.kpi.solid .dl,.kpi.orange .dl{color:#fff}
.colpick{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px;font:600 11.5px var(--f-lab);cursor:pointer;color:var(--muted)}
.chipbtn.on{background:var(--acc-soft);border-color:var(--acc);color:var(--fg)}
.qdl{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}
.qrow{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.qrow>div:first-child{display:flex;flex-direction:column;min-width:0}
.qrow .seg button{padding:5px 9px;font-size:12px}
.qrow .seg button:hover{background:var(--acc);color:#fff}
.dq{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.dqi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:left;color:inherit;font:inherit}
.dqi b{font-size:20px;min-width:48px}.dqi.bad b{color:var(--warn)}.dqi.ok b{color:var(--ok)}
.dqi:hover{border-color:var(--acc)}
.ucard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.ucard.off{opacity:.6}
.uh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.uh img{width:38px;height:38px;border-radius:50%}
.credit{margin-top:28px;padding:14px 0 4px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font:600 13px var(--f-lab);letter-spacing:.06em;color:var(--muted);text-align:center}
.credit b{font-family:var(--f-hud);letter-spacing:.1em;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.rcredit{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;align-items:center;text-align:center;font:600 9px var(--f-lab);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;max-width:76px}
.rcredit b{font:700 11px var(--f-lab);color:var(--acc);text-transform:none;letter-spacing:0;white-space:nowrap}
@media (max-width:820px){.wgrid{grid-template-columns:1fr}.wgrid>.card{grid-column:1/-1!important}.rz{display:none}.rcredit{display:none}.card.maxed{inset:8px}}

.donut-row{justify-content:center}
.donut-row .legend{flex:0 1 320px}
.card:has(>.donut-row){display:flex;flex-direction:column}
.card>.donut-row{flex:1;align-content:center}
.card.widget{display:flex;flex-direction:column}
.wcenter{flex:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;min-height:0}
.wcenter>*{max-width:100%}

function buildModel(){
  const now=new Date(),ST=settings(),EXP=+ST.expiryDays||30,OFF=+ST.offlineDays||30;
  const simList=[],exact=new Map(),by18=new Map();
  const addSim=(prov,r)=>{let o;
    if(prov==="jasper")o={prov,iccid:r[0],name:r[1],status:r[2],customer:r[3],type:r[4],msisdn:r[5],plan:r[6],activated:r[7],usage:r[8],session:r[9],added:r[10]};
    else if(prov==="hologram")o={prov,iccid:r[0],name:r[1],status:r[2],msisdn:r[3],customer:""};
    else o={prov,iccid:r[0],name:r[1],status:r[2],msisdn:r[3],imei:r[4],customer:r[5]};
    o.iccid=normSim(o.iccid);o.active=SIM_ACTIVE[prov].has(o.status);o.devices=[];o.kind="sim";
    simList.push(o);if(!exact.has(o.iccid))exact.set(o.iccid,o);const k=o.iccid.slice(0,18);if(o.iccid.length>=18&&!by18.has(k))by18.set(k,o)};
  for(const p of ["jasper","hologram","simplex"])for(const r of S.sims[p]||[])addSim(p,r);
  const findSim=s=>exact.get(s)||(s.length>=18?by18.get(s.slice(0,18)):null)||null;
  const EXC=new Set((ST.excluded||[]).map(String)),OFFA=new Set(ST.alertsOff||[]);
  let src=S.companies.filter(c=>!EXC.has(String(c.id)));
  const AO=ST.agentOverride||{};const agOf=c=>AO[String(c.id)]||c.agent||"";
  if(S.role==="agent"&&S.agent)src=src.filter(c=>normName(agOf(c))===normName(S.agent));
  const companies=[],devices=[],simUse=new Map();
  for(const c of src){
    const co={id:String(c.id),name:c.name,agent:agOf(c),collectedAt:c.collectedAt,devices:[],issues:[],key:normCo(c.name)};
    for(const r of (c.devices||[])){
      const d={kind:"device",co,id:String(r[0]),online:r[1]===1,name:r[2]||"",imei:r[3]||"",pkg:r[4]||"",version:r[5]||"",simRaw:r[6]||"",groups:r[7]||"",eff:parseISO(r[8]),last:parseISO(r[9]),remark:r[10]||"",issues:[]};
      d.sim=normSim(d.simRaw);const flag=r[11]||"";d.daysLeft=d.eff?daysBetween(d.eff,now):null;
      if(flag==="expired")d.lic="expired";else if(flag==="paused")d.lic="paused";
      else if(d.eff)d.lic=d.daysLeft<0?"expired":d.daysLeft<=EXP?"expiring":"valid";else d.lic="unknown";
      d.active=d.lic==="valid"||d.lic==="expiring";
      d.offlineDays=d.last?daysBetween(now,d.last):null;
      if(validSim(d.sim)){if(!simUse.has(d.sim))simUse.set(d.sim,[]);simUse.get(d.sim).push(d)}
      co.devices.push(d);devices.push(d)}
    companies.push(co)}
  {/* your saved actions show at once, until newer platform data arrives */
   const MA=S.meta||{};const pend=(a,src)=>{if(!a||!a.at)return false;const t=MA[src]&&MA[src].at;return !t||new Date(t)<new Date(a.at)};
   const offS=(o,a)=>{o.status=offStatus(o.prov);o.active=false;o.pending=a.at};
   for(const o of simList){const a=S.actions[simKey(o)];if(a&&SIMOFF.has(a.status)&&o.active&&pend(a,o.prov))offS(o,a)}
   for(const d of devices){const a=S.actions[devKey(d)];if(!a)continue;
     if(SIMOFF.has(a.status)&&validSim(d.sim)){const o=findSim(d.sim);if(o&&o.active&&pend(a,o.prov))offS(o,a)}
     if(LICOFF.has(a.status)&&d.lic!=="paused"&&pend(a,"inrico")){d.lic="paused";d.active=false;d.pendingLic=a.at}}}
  const coByKey=new Map(companies.map(c=>[c.key,c]));
  const AL=(ST.aliases)||{};
  const custOk=(co,cust)=>{const k=normCo(cust);if(!k)return false;if(k===co.key)return true;const a=k.replace(/s$/,""),b=co.key.replace(/s$/,"");if(a===b)return true;if(Math.min(a.length,b.length)>=4&&(a.includes(b)||b.includes(a)))return true;return (AL[co.id]||[]).includes(k)};
  const alerts=[];
  const add=(sev,type,co,title,detail,ref)=>{if(OFFA.has(type))return;const a={sev,type,co,title,detail,ref};alerts.push(a);if(co)co.issues.push(a);if(ref&&ref.issues)ref.issues.push(a)};
  for(const d of devices){const co=d.co;
    if(!d.simRaw)d.simState="none";else if(!validSim(d.sim))d.simState="invalid";
    else{const s=findSim(d.sim);if(s){d.simRec=s;s.devices.push(d);d.simState=s.active?"active":"inactive"}else d.simState="notfound"}
    const u=validSim(d.sim)?simUse.get(d.sim):null;d.dup=!!(u&&u.length>1);
    // match category
    if(d.simState==="none")d.mc="none";else if(d.simState==="invalid")d.mc="invalid";else if(d.simState==="notfound")d.mc="notfound";
    else if(d.dup)d.mc="dup";
    else if(d.simRec.prov!=="jasper")d.mc="other";
    else if(!custOk(co,d.simRec.customer))d.mc="customer";
    else if(normName(d.simRec.name)!==normName(d.name))d.mc="name";else d.mc="match";
    // device × SIM pair
    if(!d.simRec||d.lic==="unknown")d.pair="na";
    else{const sa=d.simState==="active";d.pair=d.active?(sa?"both":"nosig"):(sa?"waste":"off")}
    d.cost=d.pair==="waste"?(+((ST.simCost||{})[d.simRec.prov])||0):0;
    if(d.lic==="expiring")add("high","licence-soon",co,`Licence ends in ${d.daysLeft} day${d.daysLeft===1?"":"s"}`,`${d.name} · ${fmtDate(d.eff)}`,d);
    else if(d.lic==="expired")add("med","licence-expired",co,"Licence expired",`${d.name}${d.eff?" · "+fmtDate(d.eff):""}`,d);
    if(d.pair==="waste")add("high","waste",co,"Device deactivated, SIM still active — turn SIM off",`${d.name} · licence ${d.lic} · ${PROV[d.simRec.prov]} ${d.sim}`,d);
    if(d.pair==="nosig")add("high","nosig",co,"Device active, SIM not active",`${d.name} · ${PROV[d.simRec.prov]} SIM ${pretty(d.simRec.status)}`,d);
    if(d.mc==="none")add("med","no-sim",co,"No SIM entered in Inrico",d.name,d);
    if(d.mc==="invalid")add("med","bad-sim",co,"Invalid SIM value in Inrico",`${d.name} · "${d.simRaw}"`,d);
    if(d.mc==="notfound")add("med","sim-missing",co,"SIM not found in any carrier",`${d.name} · ${d.sim}`,d);
    if(d.simRec&&d.simRec.prov==="jasper"&&!custOk(co,d.simRec.customer))add("med","wrong-customer",co,"SIM under another Jasper customer",`${d.name} · Jasper "${d.simRec.customer||"none"}"`,d);
    if(d.simRec&&d.simRec.prov==="jasper"&&normName(d.simRec.name)!==normName(d.name))add("low","name-diff",co,"Name differs Inrico vs Jasper",`Inrico "${d.name}" · Jasper "${d.simRec.name||"blank"}"`,d);
    if(d.simState==="active"&&d.active&&d.offlineDays!=null&&d.offlineDays>OFF)add("low","offline",co,`Offline ${OFF}+ days with active SIM`,`${d.name} · last online ${fmtDate(d.last)}`,d);
    if(d.dup)d.dupWith=u.filter(x=>x!==d);if(d.dup)add("high","dup-sim",co,"Same SIM on more than one device",`${d.name} · also on ${u.filter(x=>x!==d).map(x=>x.name+" ("+x.co.name+")").join(", ")}`,d);
  }
  for(const s of simList){if(s.devices.length){s.company=s.devices[0].co;continue}
    const co=s.customer?coByKey.get(normCo(s.customer)):null;s.company=co||null;
    if(co&&s.active)add("med","sim-no-device",co,"Active SIM with no Inrico device",`${PROV[s.prov]} ${s.iccid} · "${s.name||"unnamed"}"`,s)}
  if(S.role==="agent"){for(let i=simList.length-1;i>=0;i--)if(!simList[i].company)simList.splice(i,1)}
  for(const co of companies){const ds=co.devices;co.n=ds.length;co.online=ds.filter(d=>d.online).length;
    co.valid=ds.filter(d=>d.active).length;co.deact=ds.filter(d=>d.lic==="expired"||d.lic==="paused").length;co.expiring=ds.filter(d=>d.lic==="expiring").length;
    co.matched=ds.filter(d=>d.mc==="match"||d.mc==="other").length;co.matchPct=co.n?pct(co.matched,co.n):null;
    co.waste=ds.filter(d=>d.pair==="waste").length;co.nosig=ds.filter(d=>d.pair==="nosig").length;co.wasteCost=ds.reduce((a,d)=>a+d.cost,0);
    co.simsActive=ds.filter(d=>d.simState==="active").length;co.high=co.issues.filter(a=>a.sev==="high").length;co.med=co.issues.filter(a=>a.sev==="med").length;
    const clean=ds.filter(d=>!d.issues.some(a=>a.sev!=="low")).length;co.health=co.n?Math.round(clean/co.n*100):null;
    co.carrierOnly=simList.filter(s=>s.company===co&&!s.devices.length)}
  const sev={high:0,med:1,low:2};
  alerts.sort((a,b)=>sev[a.sev]-sev[b.sev]||((a.ref&&a.ref.daysLeft!=null&&b.ref&&b.ref.daysLeft!=null)?a.ref.daysLeft-b.ref.daysLeft:0)||a.co.name.localeCompare(b.co.name));
  const cnt=(arr,f)=>arr.reduce((m,x)=>{const k=f(x);m[k]=(m[k]||0)+1;return m},{});
  return {now,companies,devices,simList,alerts,mc:cnt(devices,d=>d.mc),pair:cnt(devices,d=>d.pair),lic:cnt(devices,d=>d.lic),
    wasteCost:devices.reduce((a,d)=>a+d.cost,0),EXP,OFF,custOk};
}

async function runImport(m){

async function importData(m){
  const db=S.db,at=m.collectedAt||new Date().toISOString(),D=m.data||{},counts={},jobs=[];
  if(Array.isArray(D.companies)){const keep=new Set();
    for(const c of D.companies){const id="c"+String(c.id).replace(/[^A-Za-z0-9_-]/g,"");keep.add(id);jobs.push(()=>w(db.doc("companies/"+id),r=>r.set({id:String(c.id),name:String(c.name),agent:String(c.agent||""),collectedAt:at,devices:c.devices||[]})))}
    const existing=await db.collection("companies").limit(1000).get();
    if(!m.merge)for(const d of existing.docs)if(!keep.has(d.id))jobs.push(()=>w(db.doc("companies/"+d.id),r=>r.delete()));
    counts.companies=D.companies.length;counts.devices=D.companies.reduce((s,c)=>s+(c.devices||[]).length,0)}
  const existingSims=(D.jasper||D.hologram||D.simplex)?await db.collection("sims").get():null;
  for(const prov of ["jasper","hologram","simplex"]){if(!Array.isArray(D[prov]))continue;
    let rows=D[prov];if(m.merge){const mp=new Map((S.sims[prov]||[]).map(r=>[normSim(r[0]),r]));for(const r of rows)mp.set(normSim(r[0]),r);rows=[...mp.values()]}
    const size=400,n=Math.max(1,Math.ceil(rows.length/size));
    for(let i=0;i<n;i++){const part=rows.slice(i*size,(i+1)*size);jobs.push(()=>w(db.doc("sims/"+prov+"-"+i),r=>r.set({prov,part:i,collectedAt:at,rows:part})))}
    for(const d of existingSims.docs){const mm=d.id.match(new RegExp("^"+prov+"-(\\d+)$"));if(mm&&+mm[1]>=n)jobs.push(()=>w(db.doc("sims/"+d.id),r=>r.delete()))}
    counts[prov]=rows.length}
  S.importing={label:"Saving",done:0,total:jobs.length};render(true);
  let i=0;const run=async()=>{while(i<jobs.length){const j=jobs[i++];await j();S.importing.done++;updProg()}};
